name: Build Zuzu AI Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unzip project if a ZIP file was uploaded
        run: |
          ZIP=$(ls zuzu-fixed.zip 2>/dev/null || ls *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Found ZIP: $ZIP"
            rm -rf /tmp/proj && mkdir /tmp/proj
            unzip -q "$ZIP" -d /tmp/proj
            PKG=$(find /tmp/proj -name package.json -not -path '*/node_modules/*' | head -1)
            SRC=$(dirname "$PKG")
            echo "Project folder inside ZIP: $SRC"
            cp -a "$SRC"/. "$GITHUB_WORKSPACE"/
            rm -f "$GITHUB_WORKSPACE"/AndroidManifest.xml
            rm -rf "$GITHUB_WORKSPACE"/android
          else
            echo "No ZIP found, using repository files as they are"
          fi
          ls -la

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor Tooling
        run: npm install --no-save --legacy-peer-deps @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0

      - name: Setup Android Platform & Permissions
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.zuzu.ai.assistant","appName":"Zuzu AI","webDir":"dist","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          rm -rf android
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          import os, re
          # 1. Add required Android permissions
          p = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(p):
              s = open(p, encoding="utf-8").read()
              perms = [
                  "android.permission.INTERNET",
                  "android.permission.ACCESS_NETWORK_STATE",
                  "android.permission.RECORD_AUDIO",
                  "android.permission.MODIFY_AUDIO_SETTINGS",
                  "android.permission.VIBRATE",
              ]
              add = ""
              for x in perms:
                  if x not in s:
                      add += '    <uses-permission android:name="%s" />\n' % x
              s = s.replace("</manifest>", add + "</manifest>")
              open(p, "w", encoding="utf-8").write(s)
              print("Permissions added")

          # 2. Configure versionCode and versionName in android/app/build.gradle
          g = "android/app/build.gradle"
          if os.path.exists(g):
              txt = open(g, encoding="utf-8").read()
              txt = re.sub(r'versionCode\s+\d+', 'versionCode 351', txt)
              txt = re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "3.5.1"', txt)
              open(g, "w", encoding="utf-8").write(txt)
              print("Updated android/app/build.gradle to versionCode 351 and versionName 3.5.1")
          PY

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zuzu-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
