name: Build Zuzu AI Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Verify TypeScript & Build Web Assets
        run: |
          npm run lint
          npm run build
          test -f dist/index.html

      - name: Setup Android Platform, Native Bridge & Permissions
        env:
          CI: 'true'
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.zuzu.ai.assistant","appName":"Zuzu AI","webDir":"dist","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          rm -rf android
          npx cap add android
          if [ -d "native-android/app/src/main/java" ]; then
            mkdir -p android/app/src/main/java
            cp -rv native-android/app/src/main/java/* android/app/src/main/java/
          fi
          if [ -d "native-android/app/src/main/res" ]; then
            find android/app/src/main/res -name 'splash.png' -delete || true
            mkdir -p android/app/src/main/res
            cp -rv native-android/app/src/main/res/* android/app/src/main/res/
          fi
          npx cap sync android
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET

          # 1. Add all 30 Android assistant permissions, optional features, queries, Foreground Service & Boot Receiver
          p = "android/app/src/main/AndroidManifest.xml"
          assert os.path.exists(p), "Missing android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if 'xmlns:tools=' not in s:
              s = s.replace("<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)

          perms = [
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_ADMIN",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.BLUETOOTH_SCAN",
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MICROPHONE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
              "android.permission.SYSTEM_ALERT_WINDOW",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
              "android.permission.WRITE_SETTINGS",
              "android.permission.EXPAND_STATUS_BAR",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.CALL_PHONE",
              "android.permission.READ_CONTACTS",
              "android.permission.WRITE_CONTACTS",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.CAMERA",
              "android.permission.QUERY_ALL_PACKAGES",
              "android.permission.REQUEST_INSTALL_PACKAGES",
          ]
          add = ""
          for x in perms:
              if x not in s:
                  if x == "android.permission.WRITE_SETTINGS":
                      add += '    <uses-permission android:name="%s" tools:ignore="ProtectedPermissions" />\n' % x
                  elif x == "android.permission.QUERY_ALL_PACKAGES":
                      add += '    <uses-permission android:name="%s" tools:ignore="QueryAllPackagesPermission" />\n' % x
                  else:
                      add += '    <uses-permission android:name="%s" />\n' % x
          features = [
              "android.hardware.camera",
              "android.hardware.telephony",
              "android.hardware.location.gps",
              "android.hardware.bluetooth",
          ]
          for feat in features:
              if feat not in s:
                  add += '    <uses-feature android:name="%s" android:required="false" />\n' % feat
          if add:
              s = s.replace("</manifest>", add + "</manifest>")

          if "android.speech.RecognitionService" not in s:
              queries = "\n".join([
                  "    <queries>",
                  "        <intent>",
                  '            <action android:name="android.speech.RecognitionService" />',
                  "        </intent>",
                  "        <intent>",
                  '            <action android:name="android.intent.action.TTS_SERVICE" />',
                  "        </intent>",
                  "    </queries>",
                  "</manifest>",
              ])
              s = s.replace("</manifest>", queries)

          if "ZuzuForegroundService" not in s:
              svc = "\n".join([
                  '        <service',
                  '            android:name=".ZuzuForegroundService"',
                  '            android:enabled="true"',
                  '            android:exported="false"',
                  '            android:foregroundServiceType="microphone" />',
                  '        <receiver',
                  '            android:name=".ZuzuBootReceiver"',
                  '            android:enabled="true"',
                  '            android:exported="true">',
                  '            <intent-filter>',
                  '                <action android:name="android.intent.action.BOOT_COMPLETED" />',
                  '                <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />',
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />',
                  '                <action android:name="android.intent.action.TIME_SET" />',
                  '                <action android:name="android.intent.action.TIMEZONE_CHANGED" />',
                  '            </intent-filter>',
                  '        </receiver>',
                  '        <receiver',
                  '            android:name=".ZuzuReminderReceiver"',
                  '            android:enabled="true"',
                  '            android:exported="false" />',
                  '    </application>',
              ])
              s = s.replace("</application>", svc)
          if 'android:usesCleartextTraffic="true"' not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"')

          open(p, "w", encoding="utf-8").write(s)
          ET.parse(p)
          print("AndroidManifest.xml patched and XML-validated successfully")

          # 2. Enforce Edge-to-Edge transparent bars & notch shortEdges in values/styles.xml
          styles_path = "android/app/src/main/res/values/styles.xml"
          if os.path.exists(styles_path):
              st = open(styles_path, encoding="utf-8").read()
              if 'xmlns:tools=' not in st:
                  st = st.replace("<resources", '<resources xmlns:tools="http://schemas.android.com/tools"', 1)
              if "windowLayoutInDisplayCutoutMode" not in st:
                  edge_items = "\n".join([
                      '        <item name="android:statusBarColor" tools:targetApi="21">@android:color/transparent</item>',
                      '        <item name="android:navigationBarColor" tools:targetApi="21">@android:color/transparent</item>',
                      '        <item name="android:windowDrawsSystemBarBackgrounds" tools:targetApi="21">true</item>',
                      '        <item name="android:windowLightStatusBar" tools:targetApi="23">true</item>',
                      '        <item name="android:windowLayoutInDisplayCutoutMode" tools:targetApi="28">shortEdges</item>',
                  ])
                  st = re.sub(r'(\s*</style>)', "\n" + edge_items + r'\1', st)
              open(styles_path, "w", encoding="utf-8").write(st)
              ET.parse(styles_path)
              print("Patched styles.xml for full-screen Edge-to-Edge")

          # 3. Configure versionCode 370, versionName 3.7.0, and Credential Manager Google Sign-In deps in android/app/build.gradle
          g = "android/app/build.gradle"
          assert os.path.exists(g), "Missing android/app/build.gradle"
          txt = open(g, encoding="utf-8").read()
          txt = re.sub(r'versionCode\s+\d+', 'versionCode 370', txt)
          txt = re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "3.7.0"', txt)
          cred_deps = "\n".join([
              '    implementation "androidx.credentials:credentials:1.3.0"',
              '    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"',
              '    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"',
          ])
          if "androidx.credentials:credentials" not in txt:
              txt = txt.replace('implementation project(\':capacitor-android\')', 'implementation project(\':capacitor-android\')\n' + cred_deps, 1)
          open(g, "w", encoding="utf-8").write(txt)
          print("Updated android/app/build.gradle to versionCode 370, versionName 3.7.0, and Credential Manager deps")
          PY
          test -f android/app/src/main/assets/public/index.html

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package Versioned APK Output
        run: |
          mkdir -p apk-output
          cp -v android/app/build/outputs/apk/debug/*.apk apk-output/Zuzu-AI-v3.7.0-b370-debug.apk
          ls -lh apk-output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zuzu-AI-v3.7.0-APK
          path: apk-output/Zuzu-AI-v3.7.0-b370-debug.apk
          if-no-files-found: error
